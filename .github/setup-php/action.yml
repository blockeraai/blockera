name: 'Setup PHP and Install Composer Dependencies'
description: >
    Bootstrap sparse global-packages, then run the shared setup-php composite.
inputs:
    php-version:
        description: 'Optional. The PHP version to use. When not specified, the version is 7.4'
        required: false
        default: '7.4'
    composer-options:
        description: 'Optional. The options to use on composer install. When not specified, the options is empty'
        required: false
        default: ''
    global-packages-token:
        description: 'PAT with read access to blockera-global-packages (secrets.BLOCKERABOT_PAT).'
        required: false
        default: ''

runs:
    using: 'composite'
    steps:
        - name: Ensure global-packages submodule (sparse)
          shell: bash
          env:
              BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ inputs.global-packages-token }}
          run: bash "${GITHUB_WORKSPACE}/.github/scripts/ensure-global-packages-sparse.sh" "${GITHUB_WORKSPACE}"

        - name: Setup PHP (shared)
          uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-php
          with:
              php-version: ${{ inputs.php-version }}
              composer-options: ${{ inputs.composer-options }}
