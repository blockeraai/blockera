name: Resolve PR merge conflicts

# Ops job (not a PR test): after master moves, open feature PRs often conflict
# on the global-packages gitlink. pull_request is the wrong trigger (other PRs
# do not get an event; mergeable is often UNKNOWN). Same shape as
# merge-global-packages-mirror.yml — no pr-workflow-gate.
on:
    push:
        branches:
            - master
    workflow_dispatch:
        inputs:
            base_branch:
                description: 'Consumer base to merge into PR heads'
                required: true
                default: 'master'
            head_branch:
                description: 'Limit to this PR head (empty = all locally conflicted PRs)'
                required: false
                default: ''

concurrency:
    group: resolve-pr-conflicts
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: read

jobs:
    resolve:
        name: Merge GP mirror, then bump PR
        if: ${{ github.repository == 'blockeraai/blockera' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
            GH_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
            BLOCKERA_CONFLICT_BASE_BRANCH: ${{ github.event.inputs.base_branch || github.event.repository.default_branch }}
            BLOCKERA_CONFLICT_HEAD_BRANCH: ${{ github.event.inputs.head_branch }}
            SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
            SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.base_branch || github.event.repository.default_branch }}
                  token: ${{ secrets.BLOCKERABOT_PAT }}
                  fetch-depth: 0

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - name: Merge GP mirror, then bump PR
              run: |
                  SCRIPT=packages/global-packages/packages/dev-tools/github/scripts/jobs/resolve-pr-merge-conflicts/run.sh
                  if [[ ! -f "${SCRIPT}" ]]; then
                    echo 'resolve-pr-conflicts: toolkit pin has no job script yet; skip'
                    exit 0
                  fi
                  bash "${SCRIPT}"
