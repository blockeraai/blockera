name: JavaScript Unit Tests (By Jest)

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]

    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    unit-js:
        name: JavaScript
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: ${{ github.repository == 'blockeraai/blockera' || github.event_name == 'pull_request' }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        strategy:
            fail-fast: false
            matrix:
                node: ['18.3.0']
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node
              with:
                  node-version: ${{ matrix.node }}

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/jest-unit-tests
              with:
                  # webpack.config.js requires vendor/blockera/dev-tools (Composer path repo).
                  composer-install: 'true'
