name: Code Lint

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    pr-workflow-gate:
        name: PR workflow filter
        runs-on: ubuntu-latest
        outputs:
            run: ${{ steps.gate.outputs.run }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - id: gate
              uses: ./packages/global-packages/packages/dev-tools/github/actions/pr-workflow-gate
              with:
                  workflow-file: code-lint.yml

    lint:
        name: ${{ matrix.name }}
        needs: pr-workflow-gate
        if: ${{ needs.pr-workflow-gate.outputs.run == 'true' && (github.repository == 'blockeraai/blockera' || github.event_name == 'pull_request') }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: JavaScript coding standards
                      setup: node
                      suite: js
                    - name: CSS coding standards
                      setup: node
                      suite: css
                    - name: PHP coding standards
                      setup: php
                      suite: php
                    - name: TypeScript type check
                      setup: node
                      suite: ts
                    - name: Flow type check
                      setup: node
                      suite: flow
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - if: matrix.setup == 'node'
              uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - if: matrix.setup == 'php'
              uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-php
              with:
                  composer-options: ''

            - run: bash packages/global-packages/packages/dev-tools/github/scripts/jobs/code-lint/${{ matrix.suite }}.sh
