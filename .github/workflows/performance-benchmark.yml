name: Performance Benchmark

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

env:
    PERF_RESULTS_DIR: .github/performance/results
    WP_ARTIFACTS_PATH: ${{ github.workspace }}/artifacts
    WP_BASE_URL: http://localhost:8888
    TEST_RUNS: '20'
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
    performance_benchmark:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 120
        if: ${{ github.repository == 'blockeraai/blockera' || github.event_name == 'pull_request' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: server-timing
                      baseline: core
                      environment: default
                      name: Server-Timing (Blockera vs Core)
                    - suite: editor
                      baseline: core
                      environment: default
                      name: Block Editor (PR vs Core)
                    - suite: editor
                      baseline: master
                      environment: default
                      name: Block Editor (PR vs Master)
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/performance-benchmark
              with:
                  suite: ${{ matrix.suite }}
                  baseline: ${{ matrix.baseline }}
                  environment: ${{ matrix.environment }}
                  repo-token: ${{ secrets.BLOCKERABOT_PAT }}
