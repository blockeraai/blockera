name: 'Setup Node.js and install npm dependencies'
description: 'Configure Node.js and install npm dependencies while managing all aspects of caching.'
inputs:
    node-version:
        description: 'Optional. The Node.js version to use. When not specified, the version specified in .nvmrc will be used.'
        required: false
    global-packages-token:
        description: 'Token with read access to blockera-global-packages (use secrets.BLOCKERABOT_PAT when private).'
        required: false
        default: ''
    global-packages-ref:
        description: 'Optional ref for blockera-global-packages. Empty enables matching-branch / default-branch resolution.'
        required: false
        default: ''
    skip-global-packages:
        description: 'Set to true to skip checking out blockera-global-packages.'
        required: false
        default: 'false'

runs:
    using: 'composite'
    steps:
        - name: Setup blockera-global-packages
          if: ${{ inputs.skip-global-packages != 'true' }}
          uses: ./.github/setup-global-packages
          with:
              token: ${{ inputs.global-packages-token }}
              ref: ${{ inputs.global-packages-ref }}

        - name: Setup Node.js with built-in npm cache
          uses: actions/setup-node@v5
          with:
              node-version-file: '.nvmrc'
              node-version: ${{ inputs.node-version }}
              cache: npm

        - name: Get Node.js and npm version
          id: node-version
          run: |
              echo "NODE_VERSION=$(node -v)" >> $GITHUB_OUTPUT
          shell: bash

        - name: Cache node_modules
          id: cache-node_modules
          uses: actions/cache@v5
          with:
              path: '**/node_modules'
              key: node_modules-${{ runner.os }}-${{ steps.node-version.outputs.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

        - name: Install npm dependencies
          if: ${{ steps.cache-node_modules.outputs.cache-hit != 'true' || cancelled() }}
          run: bash .github/scripts/retry-npm-ci.sh
          shell: bash
