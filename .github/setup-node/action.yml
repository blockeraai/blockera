name: 'Setup Node.js and install npm dependencies'
description: >
    Bootstrap sparse global-packages, then run the shared setup-node composite.
inputs:
    node-version:
        description: 'Optional. The Node.js version to use. When not specified, the version specified in .nvmrc will be used.'
        required: false
    global-packages-token:
        description: 'PAT with read access to blockera-global-packages (secrets.BLOCKERABOT_PAT).'
        required: false
        default: ''
    chdir:
        description: 'Optional directory to run npm ci in.'
        required: false
        default: ''

runs:
    using: 'composite'
    steps:
        - name: Ensure global-packages submodule (sparse)
          shell: bash
          env:
              BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ inputs.global-packages-token }}
          run: bash "${GITHUB_WORKSPACE}/.github/scripts/ensure-global-packages-sparse.sh" "${GITHUB_WORKSPACE}"

        - name: Setup Node (shared)
          uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node
          with:
              node-version: ${{ inputs.node-version }}
              chdir: ${{ inputs.chdir }}
              cache-key-suffix: ${{ inputs.chdir }}
